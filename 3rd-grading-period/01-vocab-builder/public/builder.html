<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vocab Builder | CS4</title>
    <link rel="stylesheet" href="builder.css">
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
</head>
<body>
    <main>
        <header>
            <h1>Vocab Builder</h1>
            <p>Vocabulary Study and Pronunciation Tool</p>
        </header>

        <!-- search input -->
        <section class="search-section">
            <div class="search-box">
                <input type="text" id="word-input" placeholder="Enter word">
                <button id="search-btn">Search</button> <!-- maybe replace with icon (magnifying glass?) -->
            </div>
        </section>

        <!-- results display -->
        <section id="results-card" class="card hidden">
            <div class="word-header">
                <h2 id="display-word">--</h2>
                <span id="display-phonetic">/--/</span>
            </div>
            
            <div class="content-group">
                <h3>Definitions</h3>
                <ul id="definitions-list"></ul>
            </div>

            <div class="content-group">
                <h3>Synonyms</h3>
                <div id="synonyms-container" class="tag-container"></div>
            </div>
        </section>

        <!-- error message -->
        <div id="error-banner" class="error-banner hidden"></div>
    </main>
    <script src="builder.js"></script>
</body>
</html>
