<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Trivia | CS4</title>
    <link rel="stylesheet" href="trivia.css">
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
</head>
<body>
    <main class="quiz-container">
        <h1>Music Trivia</h1>

        <div class="score-header">
            <span>High Score: <strong id="high-score">0</strong></span>
        </div>

        <!-- config menu -->
        <div id="setup-card" class="">
            <!-- category dropdown -->
            <div class="setup-group">
                <label for="category-select">Category:</label>
                <select id="category-select">
                    <option value="all">All Topics</option>
                    <option value="music-theory">AP Music Theory</option>
                    <option value="beatles">Beatles Trivia</option>
                </select>
            </div>

            <!-- question count slider -->
            <div class="setup-group">
                <label for="question-slider">Questions: <span id="slider-val">5</span></label>
                <input type="range" id="question-slider" min="1" max="50" value="5">
            </div>

            <button id="start-btn">Start Quiz</button>
        </div>

        <!-- question + options -->
        <div id="quiz-card" class="hidden">
            <h2 id="question-text">Loading question...</h2>
            <div id="options-container" class="options-grid"></div>
            <p id="feedback-msg" class="feedback"></p>
            <button id="next-btn" class="hidden">Next Question</button>
        </div>

        <div id="summary-card" class="hidden">
            <h2>Quiz Completed!</h2>
            <p id="final-score-text"></p>
            <button id="restart-btn">Play Again</button>
        </div>
    </main>
    <script src="trivia.js"></script>
</body>
</html>
