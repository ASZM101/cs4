<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piano Synth | CS4</title>
    <link rel="stylesheet" href="synth.css">
</head>
<body>
    <main>
        <h1>Piano Synth</h1>

        <!-- control panel for adjusting synth settings -->
        <div class="control-panel">
            <div class="control-group">
                <label for="waveform">Waveform:</label>
                <!-- dropdown menu for choosing synth sound generator shape -->
                <select id="waveform">
                    <option value="sine">Sine (Smooth)</option>
                    <option value="square">Square (8-Bit)</option>
                    <option value="sawtooth">Sawtooth (Harsh)</option>
                    <option value="triangle">Triangle (Soft)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="volume">Volume:</label>
                <!-- slider input for output amplitude -->
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
            </div>

            <div class="control-group">
                <label for="preset-name">Preset Name:</label>
                <!-- input field for custom sound config name -->
                <input type="text" id="preset-name" placeholder="My Custom Synth">
                <!-- btn to post preset settings to backend -->
                <button id="save-preset-btn">Save Preset</button>
            </div>

            <div class="control-group">
                <label for="preset-list">Load Preset:</label>
                <!-- dropdown populated dynamically from backend -->
                <select id="preset-list">
                    <option value="">Select a preset...</option>
                </select>
            </div>
        </div>

        <!-- piano keyboard (data: custom data attribute) -->
        <div class="keyboard" id="keyboard">
            <button class="key white" data-note="261.63" data-key="a">C4<span>(A)</span></button>
            <button class="key black" data-note="277.18" data-key="w">C#4<span>(W)</span></button> 
            <button class="key white" data-note="293.66" data-key="s">D4<span>(S)</span></button>
            <button class="key black" data-note="311.13" data-key="e">D#4<span>(E)</span></button>
            <button class="key white" data-note="329.63" data-key="d">E4<span>(D)</span></button>
            <button class="key white" data-note="349.23" data-key="f">F4<span>(F)</span></button>
            <button class="key black" data-note="369.99" data-key="t">F#4<span>(T)</span></button>
            <button class="key white" data-note="392.00" data-key="g">G4<span>(G)</span></button>
            <button class="key black" data-note="415.30" data-key="y">G#4<span>(Y)</span></button>
            <button class="key white" data-note="440.00" data-key="h">A4<span>(H)</span></button>
            <button class="key black" data-note="466.16" data-key="u">A#4<span>(U)</span></button>
            <button class="key white" data-note="493.88" data-key="j">B4<span>(J)</span></button>
            <button class="key white" data-note="523.25" data-key="k">C5<span>(K)</span></button>
        </div>
    </main>
    <script src="synth.js"></script>
</body>
</html>
